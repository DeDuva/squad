version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/Squad.Agents.AI"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      # GitHub.Copilot.SDK is listed in both Microsoft groups deliberately. It is not a
      # Microsoft.* package, so without this it is proposed on its own — and on its own
      # is the shape that breaks. SquadAgent.cs reaches CopilotClient through MAF, which
      # re-exports it, so the two have to arrive together to compile.
      #
      # Grouping does not *force* them to move together; it groups whatever updates
      # exist in a run. It is a strong nudge, not a guarantee, and a solo SDK bump can
      # still appear. That is acceptable because the failure is loud: both .NET jobs go
      # red on CS0012, as they did on #124.
      microsoft-ai-majors:
        patterns:
          - "Microsoft.Agents.AI*"
          - "Microsoft.Extensions.AI"
          - "GitHub.Copilot.SDK"
        update-types:
          - "major"
      microsoft-packages:
        patterns:
          - "Microsoft.*"
          - "GitHub.Copilot.SDK"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "OpenTelemetry*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "nuget"
    directory: "/test/Squad.Agents.AI.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      microsoft-ai-majors:
        patterns:
          - "Microsoft.Agents.AI*"
          - "Microsoft.Extensions.AI"
        update-types:
          - "major"
      microsoft-packages:
        patterns:
          - "Microsoft.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "OpenTelemetry*"
        update-types:
          - "version-update:semver-major"

  # npm — the root workspace, which covers every member of `workspaces: packages/*`.
  #
  # There is deliberately no entry for `/packages/squad-cli` or `/packages/squad-sdk`.
  # Those are workspace members with no `package-lock.json` of their own, so a
  # directory-scoped entry makes Dependabot edit the member's `package.json` and
  # nothing else — leaving the manifest and the single root lockfile disagreeing, and
  # `npm ci` refusing to install. This entry already updates every member manifest
  # together with the root lockfile, which is the only combination that installs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript majors wait on typescript-eslint, which gates the whole lint step.
      # Its newest release (8.69.0) still peer-requires `typescript >=4.8.4 <6.1.0`, so
      # TS 7 has no supported toolchain to move to: npm resolves the conflict by nesting
      # duplicate @typescript-eslint trees, and `npm run lint:eslint` then runs a parser
      # against a compiler it does not claim to support. #33 and #26 are that upgrade.
      #
      # Minor and patch TypeScript updates are unaffected and still flow. Drop this once
      # typescript-eslint widens the peer range past 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # npm — Docs site (Astro/Starlight), which does have its own lockfile.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      astro-minor-patch:
        patterns:
          - "@astrojs/*"
          - "astro"
        update-types:
          - "minor"
          - "patch"
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
