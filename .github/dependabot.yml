version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/Squad.Agents.AI"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      microsoft-ai-majors:
        patterns:
          - "Microsoft.Agents.AI*"
          - "Microsoft.Extensions.AI"
        update-types:
          - "major"
      microsoft-packages:
        patterns:
          - "Microsoft.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "OpenTelemetry*"
        update-types:
          - "version-update:semver-major"
      # GitHub.Copilot.SDK is held at whatever Microsoft.Agents.AI.GitHub.Copilot was
      # built against, and is NOT independently upgradable — note this is a full stop,
      # not a semver-major one, because the break arrives on a patch bump.
      #
      # SquadAgent.cs consumes CopilotClient through MAF. MAF 1.11.0-rc1 declares
      # `GitHub.Copilot.SDK [1.0.0, )`, so restore happily accepts a newer SDK and the
      # compiler then rejects it: `CS0012: The type 'CopilotClient' is defined in an
      # assembly that is not referenced ... GitHub.Copilot.SDK, Version=1.0.0.0`. That
      # is what 1.0.3 -> 1.0.11 did in #124, on all three target frameworks.
      #
      # Lift this together with MAF, not before: 1.19.0+ declares `[1.0.5, )` and is
      # built against the newer SDK line. The direct PackageReference above is itself a
      # workaround pending microsoft/agent-framework#6457, so both are likely to be
      # resolved by the same upgrade.
      - dependency-name: "GitHub.Copilot.SDK"

  - package-ecosystem: "nuget"
    directory: "/test/Squad.Agents.AI.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      microsoft-ai-majors:
        patterns:
          - "Microsoft.Agents.AI*"
          - "Microsoft.Extensions.AI"
        update-types:
          - "major"
      microsoft-packages:
        patterns:
          - "Microsoft.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "OpenTelemetry*"
        update-types:
          - "version-update:semver-major"

  # npm — the root workspace, which covers every member of `workspaces: packages/*`.
  #
  # There is deliberately no entry for `/packages/squad-cli` or `/packages/squad-sdk`.
  # Those are workspace members with no `package-lock.json` of their own, so a
  # directory-scoped entry makes Dependabot edit the member's `package.json` and
  # nothing else — leaving the manifest and the single root lockfile disagreeing, and
  # `npm ci` refusing to install. This entry already updates every member manifest
  # together with the root lockfile, which is the only combination that installs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript majors wait on typescript-eslint, which gates the whole lint step.
      # Its newest release (8.69.0) still peer-requires `typescript >=4.8.4 <6.1.0`, so
      # TS 7 has no supported toolchain to move to: npm resolves the conflict by nesting
      # duplicate @typescript-eslint trees, and `npm run lint:eslint` then runs a parser
      # against a compiler it does not claim to support. #33 and #26 are that upgrade.
      #
      # Minor and patch TypeScript updates are unaffected and still flow. Drop this once
      # typescript-eslint widens the peer range past 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # npm — Docs site (Astro/Starlight), which does have its own lockfile.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      astro-minor-patch:
        patterns:
          - "@astrojs/*"
          - "astro"
        update-types:
          - "minor"
          - "patch"
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
