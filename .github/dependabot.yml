version: 2

# Fork-specific (DeDuva/squad). Upstream tracks NuGet and the /docs Astro site too; this
# fork does not ship either, so it no longer pays for keeping them current. Monthly, a
# cap of 3 open PRs, and grouping keep the fork's dependency churn to a few PRs a month.
updates:
  # npm — the root workspace, which covers every member of `workspaces: packages/*`.
  #
  # There is deliberately no entry for `/packages/squad-cli` or `/packages/squad-sdk`.
  # Those are workspace members with no `package-lock.json` of their own, so a
  # directory-scoped entry makes Dependabot edit the member's `package.json` and
  # nothing else — leaving the manifest and the single root lockfile disagreeing, and
  # `npm ci` refusing to install. This entry already updates every member manifest
  # together with the root lockfile, which is the only combination that installs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      majors:
        update-types:
          - "major"
    ignore:
      # TypeScript majors wait on typescript-eslint, which gates the whole lint step.
      # Its newest release (8.69.0) still peer-requires `typescript >=4.8.4 <6.1.0`, so
      # TS 7 has no supported toolchain to move to: npm resolves the conflict by nesting
      # duplicate @typescript-eslint trees, and `npm run lint:eslint` then runs a parser
      # against a compiler it does not claim to support. #33 and #26 are that upgrade.
      #
      # Minor and patch TypeScript updates are unaffected and still flow. Drop this once
      # typescript-eslint widens the peer range past 7.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # vitest 5 fails `test` (#179, #177). Hold vitest majors until squad-lab moves to
      # vitest 5; then drop these two entries.
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitest/*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      majors:
        update-types:
          - "major"
