version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/src/Squad.Agents.AI"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      microsoft-ai-majors:
        patterns:
          - "Microsoft.Agents.AI*"
          - "Microsoft.Extensions.AI"
        update-types:
          - "major"
      microsoft-packages:
        patterns:
          - "Microsoft.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "OpenTelemetry*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "nuget"
    directory: "/test/Squad.Agents.AI.Tests"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      microsoft-ai-majors:
        patterns:
          - "Microsoft.Agents.AI*"
          - "Microsoft.Extensions.AI"
        update-types:
          - "major"
      microsoft-packages:
        patterns:
          - "Microsoft.*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "OpenTelemetry*"
        update-types:
          - "version-update:semver-major"

  # npm — the root workspace, which covers every member of `workspaces: packages/*`.
  #
  # There is deliberately no entry for `/packages/squad-cli` or `/packages/squad-sdk`.
  # Those are workspace members with no `package-lock.json` of their own, so a
  # directory-scoped entry makes Dependabot edit the member's `package.json` and
  # nothing else — leaving the manifest and the single root lockfile disagreeing, and
  # `npm ci` refusing to install. This entry already updates every member manifest
  # together with the root lockfile, which is the only combination that installs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm — Docs site (Astro/Starlight), which does have its own lockfile.
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "deps"
    groups:
      astro-minor-patch:
        patterns:
          - "@astrojs/*"
          - "astro"
        update-types:
          - "minor"
          - "patch"
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels: ["dependencies", "squad:belanna"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
