# Deploys docs/html/ (the "Why this fork" overview) to GitHub Pages.
#
# One-time repo setup required: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Note that a GitHub Pages site is publicly
# accessible even while the repository is private (access-controlled Pages
# is an Enterprise feature), and Pages on a private repo requires a paid
# plan.
#
# This fork's default branch is `dev`. The inherited squad-docs.yml workflow
# (the upstream Astro docs site) only triggers on `main`, which this fork
# does not use, so the two workflows never contend for the Pages slot even
# though both use the `pages` concurrency group.
name: Deploy Pages

on:
  push:
    branches: [dev]
    paths:
      - "docs/html/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

      - id: deployment
        uses: actions/deploy-pages@v5
