name: Squad Build Validate

on:
  pull_request:
    branches: [dev, preview, main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify bundle runs
        run: node packages/squad-cli/dist/squad.js --version

      - name: Check bundle is self-contained (no missing imports)
        run: |
          node --input-type=module <<'EOF'
          import { createRequire } from 'node:module';
          import { statSync } from 'node:fs';
          const stat = statSync('packages/squad-cli/dist/squad.js');
          if (stat.size < 10000) {
            console.error('Bundle too small — build may have failed silently');
            process.exit(1);
          }
          console.log(`✅ Bundle size: ${(stat.size / 1024).toFixed(1)} KB`);
          EOF
